<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Saved Forms</title>
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="templates.css">
  </head>
  <body>
    <main class="container">
      <h1>Saved Forms</h1>
      <p>Each form page can have multiple saved versions. Restore or delete any version below.</p>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="checkpoint-groups"></div>

      <section id="legacy-section" hidden>
        <h2>Legacy FormVault templates</h2>
        <p>These records use FormVault’s older storage format. They are shown separately and are not used by Restore Saved Form.</p>
        <table class="table table-bordered">
          <thead><tr><th>Page</th><th>Actions</th></tr></thead>
          <tbody id="legacy-rows"></tbody>
        </table>
      </section>
    </main>
    <script src="../content_scripts/checkpoint-storage.js"></script>
    <script src="../popup/checkpoint-actions.js"></script>
    <script src="template-table.js"></script>
  </body>
</html>
